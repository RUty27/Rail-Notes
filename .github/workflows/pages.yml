name: Web app (GitHub Pages)

# Publishes www/ as a real website, so iPhone and iPad can install it from
# Safari with Add to Home Screen. Free, permanent, no Apple or Google account.
#
# Enable once: repo Settings -> Pages -> Source: "GitHub Actions".
# GitHub Pages needs the repository to be public on the free plan.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Stage the site
        run: |
          mkdir -p _site
          cp -r www/* _site/
          # let iOS treat it as a standalone app once added to the home screen
          test -f _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
