name: iOS TestFlight

# Builds on a macOS runner and uploads to TestFlight. You never need a Mac.
#
# ── one-time setup ─────────────────────────────────────────────────────────
# 1. Enrol in the Apple Developer Program (99 USD/year). Unavoidable for TestFlight.
# 2. App Store Connect → Users and Access → Integrations → App Store Connect API
#    → generate a team key with the "App Manager" role. Download the .p8 ONCE.
# 3. App Store Connect → Apps → + → new iOS app, bundle ID com.jackrussell.railnotes
#    (register that bundle ID first under Certificates, Identifiers & Profiles).
# 4. In this GitHub repo → Settings → Secrets and variables → Actions, add:
#      ASC_KEY_ID      — the key's ID, e.g. 2X9ABC3DEF
#      ASC_ISSUER_ID   — the issuer UUID shown above the key list
#      ASC_KEY_P8      — the whole .p8 file contents, pasted as-is
#      APPLE_TEAM_ID   — your 10-character team ID
#
# Signing certificates and profiles are created by Xcode automatically via the
# API key (-allowProvisioningUpdates), so there is nothing to export by hand.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (must be higher than the last upload)
        required: true
        default: "1"

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Register the native iOS plugin and sync web assets
        run: |
          node scripts/add-ios-plugin.js
          npx cap sync ios

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          test -s ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Set version and build number
        working-directory: ios/App
        run: |
          agvtool new-version -all "${{ github.event.inputs.build_number }}"

      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RailNotes.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: Write the export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>upload</string>
          </dict>
          </plist>
          PLIST

      - name: Export and upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RailNotes.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - name: Clean up the key
        if: always()
        run: rm -rf ~/private_keys
